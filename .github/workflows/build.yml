name: Build and package TYPE_BEL_PAY_REF plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: type-bel-pay-ref
      plugin_directory: type_bel_pay_ref
      build_target: type_bel_pay_ref
      plugin_library: type_bel_pay_ref.so
      cmake_options: -DPLUGIN_DATE_EXTRA=DYNAMIC
      test_suite: type_bel_pay_ref
      run_tests: ${{ startsWith(github.ref, 'refs/tags/v') }}
